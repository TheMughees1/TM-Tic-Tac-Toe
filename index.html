<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020">
<title>TM Tic Tac Toe | TM Studio</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b31;--line:#293552;--text:#eef3ff;--muted:#9ba9c8;--cyan:#59e1ff;--purple:#a78bfa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 0%,#20244b 0,transparent 45%),radial-gradient(ellipse at 90% 90%,#12334a 0,transparent 40%),var(--bg);font-family:system-ui,sans-serif;color:var(--text)}
.app{width:min(100%,460px);text-align:center}.brand{font-size:.76rem;letter-spacing:.22em;color:var(--cyan);font-weight:800}.brand span{color:var(--purple)}h1{font-size:clamp(2rem,8vw,3rem);margin:12px 0 6px;letter-spacing:-.05em}.sub{margin:0 0 24px;color:var(--muted)}
.panel{background:linear-gradient(145deg,#18223bf5,#0f172af5);border:1px solid var(--line);border-radius:24px;padding:clamp(16px,5vw,22px);box-shadow:0 24px 70px #0005}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;text-align:left}.field label{display:block;color:var(--muted);font-size:.78rem;margin:0 0 6px 3px}.field select{width:100%;min-width:0;padding:11px 9px;border:1px solid var(--line);border-radius:11px;background:#0d1528;color:var(--text);font:inherit}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.score{border:1px solid var(--line);background:#0d1528;border-radius:14px;padding:11px 5px}.score strong{display:block;font-size:1.4rem}.score small{color:var(--muted)}.x strong{color:var(--cyan)}.o strong{color:var(--purple)}
.status{min-height:28px;margin:12px 0 18px;font-weight:650}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border:1px solid #344261;border-radius:16px;background:linear-gradient(145deg,#192541,#10192d);font-size:clamp(2.6rem,13vw,4rem);font-weight:800;cursor:pointer;transition:.15s}.cell:hover:enabled{transform:translateY(-2px);border-color:var(--cyan)}.cell.x{color:var(--cyan)}.cell.o{color:var(--purple)}.cell.win{background:#24404b;border-color:var(--cyan);box-shadow:inset 0 0 24px #59e1ff20}.cell:disabled{cursor:default}
.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;border:0;border-radius:12px;padding:13px 10px;font-weight:750;cursor:pointer}.primary{background:linear-gradient(100deg,var(--cyan),#9af5e2);color:#081321}.secondary{background:#202b45;border:1px solid #344261;color:var(--text)}.hint{margin:18px 0 0;color:var(--muted);font-size:.78rem}button:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:3px}
@media(max-width:360px){.settings{grid-template-columns:1fr}.panel{padding:14px}.board{gap:7px}.cell{border-radius:12px}}
</style>
</head>
<body><main class="app"><div class="brand">TM <span>STUDIO</span></div><h1>Tic Tac Toe</h1><p class="sub">A tiny game. A big brain battle.</p>
<section class="panel" aria-label="Tic Tac Toe game">
<div class="settings"><div class="field"><label for="mode">Game mode</label><select id="mode"><option value="ai">Play vs AI</option><option value="local">Two players</option></select></div><div class="field" id="difficultyField"><label for="difficulty">AI difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div></div>
<div class="scores"><div class="score x"><strong id="sx">0</strong><small id="labelX">You (X)</small></div><div class="score"><strong id="sd">0</strong><small>Draws</small></div><div class="score o"><strong id="so">0</strong><small id="labelO">AI (O)</small></div></div>
<div class="status" id="status" aria-live="polite">Your turn (X)</div>
<div class="board" id="board" role="group" aria-label="Game board"><button class="cell" data-i="0" aria-label="Cell 1"></button><button class="cell" data-i="1" aria-label="Cell 2"></button><button class="cell" data-i="2" aria-label="Cell 3"></button><button class="cell" data-i="3" aria-label="Cell 4"></button><button class="cell" data-i="4" aria-label="Cell 5"></button><button class="cell" data-i="5" aria-label="Cell 6"></button><button class="cell" data-i="6" aria-label="Cell 7"></button><button class="cell" data-i="7" aria-label="Cell 8"></button><button class="cell" data-i="8" aria-label="Cell 9"></button></div>
<div class="actions"><button class="btn primary" id="restart">New Round</button><button class="btn secondary" id="reset">Reset Score</button></div>
</section><p class="hint">Play locally with a friend or challenge the AI · No downloads needed</p></main>
<script>
(()=>{const cells=[...document.querySelectorAll('.cell')],status=document.getElementById('status'),mode=document.getElementById('mode'),difficulty=document.getElementById('difficulty'),difficultyField=document.getElementById('difficultyField'),labelX=document.getElementById('labelX'),labelO=document.getElementById('labelO'),els={X:document.getElementById('sx'),O:document.getElementById('so'),D:document.getElementById('sd')},lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(''),turn='X',active=true,scores={X:0,O:0,D:0},thinking=false;
function winningLine(b=board){for(const l of lines){const[a,c,d]=l;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return l}return null}
function winnerMark(b){const l=winningLine(b);return l?b[l[0]]:null}
function available(b=board){return b.map((v,i)=>v?null:i).filter(i=>i!==null)}
function tacticalMove(mark){for(const i of available()){const copy=[...board];copy[i]=mark;if(winnerMark(copy))return i}return null}
function randomMove(){const a=available();return a[Math.floor(Math.random()*a.length)]}
function mediumMove(){return tacticalMove('O')??tacticalMove('X')??(board[4]=== ''?4:null)??randomMove()}
function minimax(b,isMax,depth){const w=winnerMark(b);if(w==='O')return 10-depth;if(w==='X')return depth-10;if(!b.includes(''))return 0;let best=isMax?-Infinity:Infinity;for(const i of available(b)){b[i]=isMax?'O':'X';const score=minimax(b,!isMax,depth+1);b[i]='';best=isMax?Math.max(best,score):Math.min(best,score)}return best}
function hardMove(){let best=-Infinity,choice=null;for(const i of available()){board[i]='O';const score=minimax(board,false,0);board[i]='';if(score>best){best=score;choice=i}}return choice}
function render(){cells.forEach((c,i)=>{c.textContent=board[i];c.className='cell'+(board[i]?' '+board[i].toLowerCase():'');c.disabled=!active||thinking||!!board[i]||(mode.value==='ai'&&turn==='O');c.setAttribute('aria-label','Cell '+(i+1)+(board[i]?', '+board[i]:''))})}
function finishIfOver(){const won=winningLine();if(won){active=false;scores[turn]++;els[turn].textContent=scores[turn];won.forEach(i=>cells[i].classList.add('win'));status.textContent=(mode.value==='ai'?(turn==='X'?'🎉 You win!':'🤖 AI wins!'):'🎉 Player '+turn+' wins!');render();return true}if(board.every(Boolean)){active=false;scores.D++;els.D.textContent=scores.D;status.textContent="It's a draw! 🤝";render();return true}return false}
function humanOrLocalPlay(i){if(!active||thinking||board[i]||(mode.value==='ai'&&turn==='O'))return;board[i]=turn;render();if(finishIfOver())return;turn=turn==='X'?'O':'X';status.textContent=mode.value==='ai'?"AI is thinking…": "Player "+turn+"'s turn";render();if(mode.value==='ai')setTimeout(aiPlay,280)}
function aiPlay(){if(!active||mode.value!=='ai'||turn!=='O')return;thinking=true;render();const move=difficulty.value==='easy'?randomMove():difficulty.value==='medium'?mediumMove():hardMove();if(move!==null)board[move]='O';thinking=false;render();if(finishIfOver())return;turn='X';status.textContent='Your turn (X)';render()}
function fresh(){board=Array(9).fill('');turn='X';active=true;thinking=false;status.textContent=mode.value==='ai'?'Your turn (X)':"Player X's turn";render()}
function syncMode(){const ai=mode.value==='ai';difficultyField.hidden=!ai;labelX.textContent=ai?'You (X)':'Player X';labelO.textContent=ai?'AI (O)':'Player O';fresh()}
cells.forEach(c=>c.addEventListener('click',()=>humanOrLocalPlay(+c.dataset.i)));document.getElementById('restart').addEventListener('click',fresh);document.getElementById('reset').addEventListener('click',()=>{scores={X:0,O:0,D:0};Object.keys(els).forEach(k=>els[k].textContent='0');fresh()});mode.addEventListener('change',syncMode);difficulty.addEventListener('change',fresh);syncMode();
})();
</script></body></html>
