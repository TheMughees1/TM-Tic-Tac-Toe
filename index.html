<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171026">
<meta name="description" content="Play TM Tic Tac Toe: arcade-style Tic-Tac-Toe with AI difficulty levels, local multiplayer, extra board modes, sound and saved stats.">
<title>TM Tic-Tac-Toe — Arcade Edition | TM Studio</title>
<style>
:root{color-scheme:dark;--bg:#100b1b;--panel:#1d1530;--panel2:#261b3d;--line:#49345f;--text:#fff8ff;--muted:#c0b0d3;--pink:#ff5db1;--yellow:#ffe66d;--blue:#64e8ff;--green:#8cffb7;--shadow:0 24px 70px #05020d99}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;padding:28px 16px 36px;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(ellipse at 12% 8%,#52235d88,transparent 34%),radial-gradient(ellipse at 92% 82%,#164f6c66,transparent 36%),var(--bg);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--text)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
button,select{font:inherit}button:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.app{position:relative;width:min(100%,520px);z-index:1}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 18px}.brand{font-size:.75rem;letter-spacing:.2em;font-weight:950;color:var(--yellow)}.brand span{color:var(--pink)}.pill{border:1px solid #725a89;background:#211832;border-radius:999px;padding:7px 11px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.08em}
.hero{text-align:center;margin-bottom:22px}.eyebrow{display:inline-flex;align-items:center;gap:7px;border:1px solid #6d3b70;background:#301a40;border-radius:999px;padding:6px 11px;color:#ffb9e0;font-size:.68rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.spark{color:var(--yellow)}h1{font-size:clamp(2.5rem,10vw,4.4rem);line-height:.98;letter-spacing:-.07em;margin:13px 0 9px;text-transform:uppercase;font-weight:1000;text-shadow:4px 4px 0 #7e2c81,7px 7px 0 #321947}h1 .tic{color:var(--yellow)}h1 .tac{color:var(--pink)}h1 .toe{color:var(--blue)}.sub{margin:0;color:var(--muted);font-size:.94rem}
.panel{background:linear-gradient(145deg,#281d3df5,#171126f5);border:1px solid #59416e;border-radius:27px;padding:clamp(15px,4.5vw,22px);box-shadow:var(--shadow);position:relative;overflow:hidden}.panel:before{content:"";position:absolute;left:8%;right:8%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--pink),var(--yellow),var(--blue),transparent);opacity:.85}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;text-align:left}.field label{display:block;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin:0 0 7px 3px}.field select{width:100%;min-width:0;padding:11px 10px;border:1px solid #5a456e;border-radius:13px;background:#150f23;color:var(--text);font-weight:750}
.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.score{border:1px solid #4b375e;background:#171126;border-radius:16px;padding:10px 5px 9px;position:relative;overflow:hidden}.score strong{display:block;font-size:1.55rem;line-height:1.1;font-variant-numeric:tabular-nums}.score small{display:block;color:var(--muted);font-size:.7rem;margin-top:5px;font-weight:800}.score.x strong{color:var(--blue)}.score.draw strong{color:var(--yellow)}.score.o strong{color:var(--pink)}.score .scorebar{height:3px;position:absolute;bottom:0;left:0;right:0;background:currentColor;opacity:.8}.score.x{color:var(--blue)}.score.draw{color:var(--yellow)}.score.o{color:var(--pink)}
.statusrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}.status{min-height:24px;text-align:left;font-weight:900;font-size:.9rem}.turntag{flex-shrink:0;color:#1a1125;background:var(--yellow);border-radius:999px;padding:6px 9px;font-size:.67rem;font-weight:1000;letter-spacing:.08em}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;touch-action:manipulation}.board.size4{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.cell{position:relative;aspect-ratio:1;min-width:0;border:1px solid #604779;border-radius:17px;background:linear-gradient(145deg,#39264f,#201631);color:var(--text);font-size:clamp(2.5rem,12vw,4rem);font-weight:1000;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;box-shadow:inset 0 -4px 0 #09051155;display:grid;place-items:center;line-height:1}.board.size4 .cell{border-radius:12px;font-size:clamp(1.7rem,7vw,2.6rem)}.cell:enabled:hover{transform:translateY(-3px);border-color:var(--yellow);box-shadow:0 7px 0 #10091c,inset 0 0 20px #ffe66d14}.cell:active:enabled{transform:translateY(0)}.cell.x{color:var(--blue);text-shadow:0 0 20px #64e8ff44;animation:pop .22s cubic-bezier(.2,1.8,.4,1)}.cell.o{color:var(--pink);text-shadow:0 0 20px #ff5db144;animation:pop .22s cubic-bezier(.2,1.8,.4,1)}.cell.win{background:linear-gradient(145deg,#3f6a58,#224b52);border-color:var(--green);box-shadow:0 0 0 2px #8cffb744,0 0 25px #8cffb733;animation:winpulse .75s ease-in-out infinite alternate}.cell:disabled{cursor:default}.board.thinking{filter:saturate(.8)}
@keyframes pop{from{transform:scale(.65) rotate(-8deg);opacity:.4}to{transform:scale(1) rotate(0);opacity:1}}@keyframes winpulse{from{box-shadow:0 0 0 1px #8cffb733,0 0 10px #8cffb722}to{box-shadow:0 0 0 3px #8cffb766,0 0 27px #8cffb755}}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:.72rem;font-weight:750}.streak{color:var(--yellow)}.actions{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:9px;margin-top:16px}.btn{border:0;border-radius:13px;padding:12px 8px;font-weight:950;font-size:.8rem;cursor:pointer;transition:transform .15s,filter .15s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{background:linear-gradient(110deg,var(--yellow),#ffb76a);color:#25142d;box-shadow:0 4px 0 #9b5a43}.secondary{background:#342347;border:1px solid #644a7c;color:var(--text)}.tinyactions{display:flex;gap:8px;margin-top:10px}.tiny{flex:1;background:transparent;color:var(--muted);border:1px solid #4c395f;border-radius:11px;padding:9px;font-size:.74rem;font-weight:850;cursor:pointer}.tiny:hover{border-color:var(--blue);color:var(--text)}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px;color:#8e7da5;font-size:.69rem}.footer strong{color:#c5b0db;letter-spacing:.12em}.badge{color:var(--green)}
[hidden]{display:none!important}
@media(max-width:390px){body{padding:18px 10px 26px}.settings{gap:8px}.field select{font-size:.85rem;padding:10px 7px}.panel{border-radius:22px}.board{gap:7px}.cell{border-radius:13px}.actions{grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1}.topline{margin-bottom:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
  <div class="topline"><div class="brand">TM <span>STUDIO</span></div><div class="pill">ARCADE EDITION <span class="spark">✦</span></div></div>
  <header class="hero"><div class="eyebrow"><span class="spark">✦</span> Ready, set, think!</div><h1><span class="tic">TIC</span> <span class="tac">TAC</span><br><span class="toe">TOE!</span></h1><p class="sub">Tiny board. Big brain energy.</p></header>
  <section class="panel" aria-label="Tic Tac Toe game">
    <div class="settings">
      <div class="field"><label for="mode">Game mode</label><select id="mode"><option value="ai">🤖 vs AI</option><option value="local">👥 2 Players</option></select></div>
      <div class="field"><label for="boardMode">Board mode</label><select id="boardMode"><option value="classic">Classic 3 × 3</option><option value="mega">Mega 4 × 4</option></select></div>
      <div class="field" id="difficultyField"><label for="difficulty">AI difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Unbeatable (3×3)</option></select></div>
      <div class="field"><label for="firstTurn">First turn (2P)</label><select id="firstTurn"><option value="X">✕ Player X</option><option value="O">◯ Player O</option></select></div>
    </div>
    <div class="scoregrid">
      <div class="score x"><strong id="sx">0</strong><small id="labelX">YOU (X)</small><span class="scorebar"></span></div>
      <div class="score draw"><strong id="sd">0</strong><small>DRAWS</small><span class="scorebar"></span></div>
      <div class="score o"><strong id="so">0</strong><small id="labelO">AI (O)</small><span class="scorebar"></span></div>
    </div>
    <div class="statusrow"><div class="status" id="status" aria-live="polite">Your turn — X</div><div class="turntag" id="turnTag">YOUR TURN</div></div>
    <div class="board" id="board" role="group" aria-label="Game board"></div>
    <div class="meta"><span>🔥 Streak: <b class="streak" id="streak">0</b></span><span id="roundInfo">Round 1 · First to 3?</span></div>
    <div class="actions"><button class="btn primary" id="restart">↻ New Round</button><button class="btn secondary" id="undo">↶ Undo</button><button class="btn secondary" id="reset">Reset Stats</button></div>
    <div class="tinyactions"><button class="tiny" id="sound" aria-pressed="false">♫ Sound: Off</button><button class="tiny" id="theme">✦ Switch Colors</button></div>
  </section>
  <footer class="footer"><span><strong>TM STUDIO</strong> · THINK DIFFERENT</span><span class="badge" id="saveStatus">● Stats saved on this device</span></footer>
</main>
<script>
(function(){
const $=id=>document.getElementById(id);
const boardEl=$('board'),statusEl=$('status'),modeEl=$('mode'),difficultyEl=$('difficulty'),boardModeEl=$('boardMode'),firstTurnEl=$('firstTurn'),difficultyField=$('difficultyField');
const scoreEls={X:$('sx'),O:$('so'),D:$('sd')};
const lines3=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let size=3,winLength=3,board=[],turn='X',active=true,thinking=false,history=[],round=1,streak=0,soundOn=false,themeIndex=0;
let stats={X:0,O:0,D:0,streak:0,round:1};
try{const saved=JSON.parse(localStorage.getItem('tm-ttt-stats-v2')||'null');if(saved&&typeof saved==='object'){stats.X=Number(saved.X)||0;stats.O=Number(saved.O)||0;stats.D=Number(saved.D)||0;stats.streak=Number(saved.streak)||0;stats.round=Number(saved.round)||1;}}catch(e){}
streak=stats.streak;round=stats.round;
const themes=[{pink:'#ff5db1',yellow:'#ffe66d',blue:'#64e8ff',green:'#8cffb7'},{pink:'#ff8a5b',yellow:'#baff6a',blue:'#7c9bff',green:'#75ffd8'},{pink:'#f78bff',yellow:'#ffdf8a',blue:'#74f4d0',green:'#b6ff75'}];
function persist(){stats.X=stats.X||0;stats.O=stats.O||0;stats.D=stats.D||0;stats.streak=streak;stats.round=round;try{localStorage.setItem('tm-ttt-stats-v2',JSON.stringify(stats));$('saveStatus').textContent='● Stats saved on this device'}catch(e){$('saveStatus').textContent='● Session stats only'}}
function playTone(freq,duration,type){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type||'sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.055,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration);osc.onended=()=>ctx.close()}catch(e){}}
function currentSymbol(){return modeEl.value==='ai'?'X':turn}
function available(b=board){const a=[];for(let i=0;i<b.length;i++)if(!b[i])a.push(i);return a}
function getLines(){if(size===3)return lines3;const out=[];for(let r=0;r<size;r++)for(let c=0;c<=size-winLength;c++){const line=[];for(let k=0;k<winLength;k++)line.push(r*size+c+k);out.push(line)}for(let c=0;c<size;c++)for(let r=0;r<=size-winLength;r++){const line=[];for(let k=0;k<winLength;k++)line.push((r+k)*size+c);out.push(line)}for(let r=0;r<=size-winLength;r++)for(let c=0;c<=size-winLength;c++){const a=[],b=[];for(let k=0;k<winLength;k++){a.push((r+k)*size+c+k);b.push((r+k)*size+c+winLength-1-k)}out.push(a,b)}return out}
function winningLine(b=board){for(const line of getLines())if(b[line[0]]&&line.every(i=>b[i]===b[line[0]]))return line;return null}
function winnerMark(b=board){const line=winningLine(b);return line?b[line[0]]:null}
function tacticalMove(mark){for(const i of available()){board[i]=mark;const won=!!winnerMark(board);board[i]='';if(won)return i}return null}
function randomMove(){const a=available();return a.length?a[Math.floor(Math.random()*a.length)]:null}
function mediumMove(){const win=tacticalMove('O');if(win!==null)return win;const block=tacticalMove('X');if(block!==null)return block;if(board[4]==='')return 4;const corners=[0,2,6,8].filter(i=>board[i]==='');if(corners.length)return corners[Math.floor(Math.random()*corners.length)];return randomMove()}
function minimax(b,isMax,depth,alpha,beta){const w=winnerMark(b);if(w==='O')return 10-depth;if(w==='X')return depth-10;if(!b.includes(''))return 0;let best=isMax?-Infinity:Infinity;for(const i of available(b)){b[i]=isMax?'O':'X';const val=minimax(b,!isMax,depth+1,alpha,beta);b[i]='';if(isMax){best=Math.max(best,val);alpha=Math.max(alpha,best)}else{best=Math.min(best,val);beta=Math.min(beta,best)}if(beta<=alpha)break}return best}
function hardMove(){if(size!==3)return mediumMove();let best=-Infinity,choice=null;for(const i of available()){board[i]='O';const score=minimax(board,false,0,-Infinity,Infinity);board[i]='';if(score>best){best=score;choice=i}}return choice}
function createBoard(){boardEl.innerHTML='';boardEl.classList.toggle('size4',size===4);for(let i=0;i<size*size;i++){const b=document.createElement('button');b.type='button';b.className='cell';b.dataset.i=String(i);b.setAttribute('aria-label','Cell '+(i+1));b.addEventListener('click',()=>playAt(i));boardEl.appendChild(b)}}
function render(){const cells=[...boardEl.querySelectorAll('.cell')];cells.forEach((c,i)=>{c.textContent=board[i]?(board[i]==='X'?'✕':'◯'):'';c.className='cell'+(board[i]?' '+board[i].toLowerCase():'');c.disabled=!active||thinking||!!board[i]||(modeEl.value==='ai'&&turn==='O');c.setAttribute('aria-label','Cell '+(i+1)+(board[i]?', '+board[i]:', empty'))});boardEl.classList.toggle('thinking',thinking);scoreEls.X.textContent=stats.X||0;scoreEls.O.textContent=stats.O||0;scoreEls.D.textContent=stats.D||0;$('streak').textContent=streak;$('roundInfo').textContent='Round '+round+' · '+(size===3?'3 in a row':'4 in a row');$('turnTag').textContent=!active?'ROUND OVER':thinking?'THINKING…':(modeEl.value==='ai'&&turn==='O')?'AI TURN':' '+(modeEl.value==='ai'?'YOUR TURN':'PLAYER '+turn);$('labelX').textContent=modeEl.value==='ai'?'YOU (X)':'PLAYER X';$('labelO').textContent=modeEl.value==='ai'?'AI (O)':'PLAYER O';}
function finishIfOver(){const line=winningLine();if(line){active=false;line.forEach(i=>boardEl.querySelector('[data-i="'+i+'"]').classList.add('win'));const winner=board[line[0]];if(modeEl.value==='ai'){if(winner==='X'){stats.X++;streak++;statusEl.textContent='🎉 You win! Big brain energy.';playTone(660,.13,'triangle');setTimeout(()=>playTone(880,.2,'triangle'),100)}else{stats.O++;streak=0;statusEl.textContent='🤖 AI takes this round! Try again.';playTone(190,.25,'sawtooth')}}else{stats[winner]++;streak=winner==='X'||winner==='O'?streak+1:streak;statusEl.textContent='🏆 Player '+winner+' wins!';playTone(740,.22,'triangle')}persist();render();return true}if(board.every(Boolean)){active=false;stats.D++;streak=0;statusEl.textContent='🤝 Draw! Nobody backs down.';playTone(330,.18,'sine');persist();render();return true}return false}
function playAt(i){if(!active||thinking||board[i]||(modeEl.value==='ai'&&turn==='O'))return;history.push({board:board.slice(),turn:turn});board[i]=turn;playTone(turn==='X'?520:390,.09,'sine');render();if(finishIfOver())return;turn=turn==='X'?'O':'X';statusEl.textContent=modeEl.value==='ai'?'🤖 AI is thinking…':'Player '+turn+' — your move';render();if(modeEl.value==='ai')setTimeout(aiPlay,350)}
function aiPlay(){if(!active||modeEl.value!=='ai'||turn!=='O')return;thinking=true;render();setTimeout(()=>{if(!active||modeEl.value!=='ai'){thinking=false;render();return}let move;if(difficultyEl.value==='easy')move=randomMove();else if(difficultyEl.value==='hard'&&size===3)move=hardMove();else move=mediumMove();if(move!==null)board[move]='O';thinking=false;playTone(430,.1,'sine');render();if(finishIfOver())return;turn='X';statusEl.textContent='Your turn — X';render()},180)}
function fresh(){size=boardModeEl.value==='mega'?4:3;winLength=size===4?4:3;board=Array(size*size).fill('');turn=modeEl.value==='ai'?'X':firstTurnEl.value;active=true;thinking=false;history=[];createBoard();if(modeEl.value==='ai'&&turn==='O'){statusEl.textContent='🤖 AI starts…';render();setTimeout(aiPlay,320)}else statusEl.textContent=modeEl.value==='ai'?'Your turn — X':"Player X — your move";render()}
function undo(){if(!history.length)return;thinking=false;if(modeEl.value==='ai'){const previous=history.pop();board=previous.board;turn=previous.turn;if(history.length&&board.some(Boolean)&&turn==='O'){const earlier=history.pop();board=earlier.board;turn=earlier.turn}}else{const previous=history.pop();board=previous.board;turn=previous.turn}active=true;statusEl.textContent=modeEl.value==='ai'?'Your turn — X':'Player '+turn+' — your move';render()}
function syncSettings(){difficultyField.hidden=modeEl.value!=='ai';if(difficultyEl.value==='hard'&&boardModeEl.value==='mega')$('roundInfo').textContent='Mega mode uses tactical AI';fresh()}
$('restart').addEventListener('click',()=>{round++;persist();fresh();playTone(480,.08,'sine')});
$('undo').addEventListener('click',undo);
$('reset').addEventListener('click',()=>{stats={X:0,O:0,D:0,streak:0,round:1};streak=0;round=1;persist();fresh();statusEl.textContent='Stats reset. Fresh start!'});
modeEl.addEventListener('change',syncSettings);boardModeEl.addEventListener('change',syncSettings);difficultyEl.addEventListener('change',fresh);firstTurnEl.addEventListener('change',fresh);
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent='♫ Sound: '+(soundOn?'On':'Off');$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)playTone(620,.1,'triangle')});
$('theme').addEventListener('click',()=>{themeIndex=(themeIndex+1)%themes.length;const t=themes[themeIndex];document.documentElement.style.setProperty('--pink',t.pink);document.documentElement.style.setProperty('--yellow',t.yellow);document.documentElement.style.setProperty('--blue',t.blue);document.documentElement.style.setProperty('--green',t.green);playTone(560,.07,'sine')});
syncSettings();persist();
})();
</script>
</body>
</html>
